# Simplified Chinese Windows draft delivery; see MODIFICATIONS.md.
name: Simplified Chinese Windows draft assets

on:
  push:
    branches: [codex/zh-cn-windows-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blockout-zh-cn-local-draft-assets
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.ref == 'refs/heads/codex/zh-cn-windows-release'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install and checksum-verify Electron
        run: node node_modules/electron/install.js
      - run: npm run verify:assets
      - run: npm run verify:builder-config -- electron-builder.yml deploy/electron-builder.zh-CN.yml
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build audited native Windows Chinese NSIS and ZIP
        run: node deploy/package-windows-zh.mjs
      - name: Configure Windows smoke paths
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "OneDrive - Studio\Director's Cut\José"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          "BLOCKOUT_E2E_ROOT=$smokeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLOCKOUT_FFMPEG=$env:GITHUB_WORKSPACE\vendor\ffmpeg\win-x64\ffmpeg.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLOCKOUT_FFPROBE=$env:GITHUB_WORKSPACE\vendor\ffmpeg\win-x64\ffprobe.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify the Chinese workflow and video exports on Windows
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/localization.spec.ts
      - name: Retain traces if Windows smoke fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Blockout-zh-CN-windows-smoke-traces
          if-no-files-found: ignore
          path: test-results/
      - name: Archive the exact source commit and stage deployment instructions
        shell: pwsh
        run: |
          git archive --format=zip --prefix=blockout-zh-CN/ --output=release/Blockout-zh-CN-5.1.1-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item docs/DEPLOY-WINDOWS.zh-CN.md release/DEPLOY-WINDOWS.zh-CN.md
      - name: Validate every output and write SHA256 manifest
        run: node .github/scripts/windows-release-draft.mjs --prepare
      - name: Retain downloadable build artifacts before draft upload
        uses: actions/upload-artifact@v4
        with:
          name: Blockout-zh-CN-5.1.1-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            release/Blockout-zh-CN-5.1.1-win-x64-Setup.exe
            release/Blockout-zh-CN-5.1.1-win-x64.zip
            release/Blockout-zh-CN-5.1.1-source.zip
            release/DEPLOY-WINDOWS.zh-CN.md
            release/SHA256SUMS.txt
            release/upload-manifest.json

  upload-existing-draft:
    needs: build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: Blockout-zh-CN-5.1.1-windows-x64
          path: release
      - name: Verify and upload missing assets to the existing draft only
        run: node .github/scripts/windows-release-draft.mjs --upload
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain successful upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blockout-zh-CN-draft-upload-receipt
          retention-days: 14
          if-no-files-found: warn
          path: release/draft-upload-receipt.json
