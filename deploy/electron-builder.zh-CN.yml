# Simplified Chinese local Windows distribution; see MODIFICATIONS.md.
extends: ./electron-builder.yml
appId: com.blockout.zhcn
productName: Blockout 简体中文版
artifactName: Blockout-zh-CN-${version}-win-${arch}.${ext}
win:
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  extraResources:
    # FFmpeg executables, GPL license and provenance are inherited once from
    # the base win.extraResources. Extends concatenates these arrays.
    - from: release/ffmpeg-corresponding-source
      to: ffmpeg-source/archives
    - from: docs/DEPLOY-WINDOWS.zh-CN.md
      to: 本地部署说明.md
nsis:
  artifactName: Blockout-zh-CN-${version}-win-${arch}-Setup.${ext}
  shortcutName: Blockout 简体中文版
  uninstallDisplayName: Blockout 简体中文版
  installerLanguages:
    - zh_CN
  language: '2052'
  displayLanguageSelector: false
